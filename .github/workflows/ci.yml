name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    name: Build Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build
        run: |
          cd apps/web
          npm install
          npm run build

  test-backend:
    name: Test Backend API (Node / Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Generate Prisma
        run: |
          cd apps/api
          npm install
          npx prisma generate
          npx prisma db push
      - name: Run Backend Tests
        run: |
          cd apps/api
          node --test test/api.test.js

  test-ml-service:
    name: Test ML Service (FastAPI / Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd services/ml-service
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          cd services/ml-service
          pytest tests/test_ml.py
